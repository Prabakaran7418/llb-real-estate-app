name: llb_real_estate
description: "LLB Real Estate - Official Mobile Application for Lokesh Laven Barani Real Estate Company"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation & Routing
  go_router: ^14.1.4

  # Firebase Suite
  firebase_core: ^2.30.1
  firebase_auth: ^4.19.4
  cloud_firestore: ^4.17.2
  firebase_storage: ^11.7.4
  firebase_messaging: ^14.9.1

  # GIS Map & Location (Zero API Key OpenStreetMap)
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^11.0.0

  # Networking & HTTP (n8n Webhook & APIs)
  http: ^1.2.1

  # Storage & Utilities
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  url_launcher: ^6.2.6
  uuid: ^4.4.0
  cached_network_image: ^3.3.1

  # Icons & Styling
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
